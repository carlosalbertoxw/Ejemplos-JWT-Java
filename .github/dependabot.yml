# Propone actualizaciones semanales de dependencias, imágenes base y GitHub Actions.
version: 2
updates:
  - package-ecosystem: maven
    directories: ["/api", "/web"]
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: docker
    directories: ["/api", "/web"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
