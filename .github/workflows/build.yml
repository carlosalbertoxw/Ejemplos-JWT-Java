name: Build y pruebas

on:
  # push solo en master: en las ramas de los PR ya corre por pull_request
  # (si no, cada PR ejecutaría el workflow dos veces).
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compila con -Xlint:all (falla ante advertencias) y ejecuta las pruebas.
      - name: mvn verify (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: mvn -B verify

  docker:
    # Construye las imágenes y levanta el stack con docker compose. Así se
    # prueban de verdad los Dockerfiles (y los PR de Dependabot que cambian sus
    # imágenes base) y que los health checks respondan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir y levantar
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs

      - name: Detener
        if: always()
        run: docker compose down --volumes
